name: 記事をつくる

on:
  # 毎日の自動実行は、夜旅さんのOKが出るまで止めておく。
  # 始めるときは下の3行の # を外す。
  # schedule:
  #   - cron: '0 11 * * *'   # 毎日 20:00（日本時間）に翌日分
  #   - cron: '0 14 * * *'   # 23:00 にもう一度（20時に失敗した枠だけ埋める。あるIDは作らない）
  workflow_dispatch:
    inputs:
      limit:
        description: '何本だけ作るか（試すときは 1。0 なら全部）'
        default: '1'

# 同時に2つ動かない（二重に作らないため）
concurrency:
  group: generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 記事をつくる
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: node scripts/generate.mjs
      - name: 保存する
        run: |
          git config user.name "kyokou-bot"
          git config user.email "kyokou-bot@users.noreply.github.com"
          git add -A docs yobi.json
          git diff --cached --quiet || git commit -m "記事を追加"
          git push
